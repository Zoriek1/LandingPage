name: Validate candidate

# Explicit candidate validation; never runs deployment or live catalog sync.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      analytics-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: analytics_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:build
        env:
          VITE_ANALYTICS_ENABLED: 'false'
      - run: npm run analytics:test
        env:
          ANALYTICS_TEST_DATABASE_URL: postgres://analytics:ci-only@127.0.0.1:5432/analytics_test
